name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run validation suite (lint, typecheck, test, UI, links, size, secrets, format)
        run: npm run validate

      - name: Traceability check
        run: npm run check:traceability

      - name: Run policy matrix tests
        run: npm run test:policy

      - name: Timezone invariance tests
        run: npm run test:tz

      - name: Build project
        run: npm run build

      - name: Single branch policy check
        run: npm run check:branches

      - name: Security audit
        run: npm audit --audit-level=high
