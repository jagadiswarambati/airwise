name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Traceability check
        run: npm run check:traceability

      - name: UI design tokens and style checks
        run: npm run check:ui

      - name: Run unit & contract tests
        run: npm test

      - name: Run policy matrix tests
        run: npm run test:policy

      - name: Timezone invariance tests
        run: npm run test:tz

      - name: Build project
        run: npm run build

      - name: Secret scan
        run: npm run scan:secrets

      - name: Repository size check
        run: npm run check:size

      - name: Single branch policy check
        run: npm run check:branches

      - name: Security audit
        run: npm audit --audit-level=high
